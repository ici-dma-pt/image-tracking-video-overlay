<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Image Tracking - Video Overlay</title>
  
    <!-- A-Frame & AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  
    <!-- Local CSS -->
    <link href="/assets/styles/css/main.css" rel="stylesheet" />
  </head>  

  <body>
    <!-- Bootstrap menu button -->
    <div class="position-absolute top-0 start-0 p-3 z-3">
      <button class="btn btn-light btn-sm" onclick="alert('Menu clicked')">☰ Menu</button>
    </div>

    <!-- Loader -->
    <div class="arjs-loader d-flex justify-content-center align-items-center">
      <div class="text-white fs-5">Loading, please wait...</div>
    </div>

    <!-- Hidden video -->
    <video
      id="ar-video"
      src="/assets/videos/intro.mp4"
      preload="auto"
      autoplay
      loop
      muted
      playsinline
      crossorigin="anonymous"
      style="display: none"
    ></video>

    <!-- AR Scene -->
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >
      <a-nft
        type="nft"
        url="assets/nft/lotus"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5"
        emitevents="true"
      >
        <a-video
          src="#ar-video"
          width="1.78"
          height="1"
          rotation="-90 0 0"
          position="0 0 0"
        ></a-video>
      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>

    <!-- Local JS -->
    <script src="/assets/scripts/js/main.js"></script>
  </body>
</html>
